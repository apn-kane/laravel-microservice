version: '3.8'

services:
  # ─── PHP-FPM Services ───────────────────────────────────────
  user-service:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: user-service
    volumes:
      - ./user-service:/var/www
    networks:
      - microservices
    depends_on:
      - user-db
      - kafka

  product-service:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: product-service
    volumes:
      - ./product-service:/var/www
    networks:
      - microservices
    depends_on:
      - product-db
      - kafka

  order-service:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: order-service
    volumes:
      - ./order-service:/var/www
    networks:
      - microservices
    depends_on:
      - order-db
      - kafka

  api-gateway:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: api-gateway
    volumes:
      - ./api-gateway:/var/www
    networks:
      - microservices

  # ─── Nginx Services ─────────────────────────────────────────
  user-nginx:
    image: nginx:alpine
    container_name: user-nginx
    ports:
      - "8001:80"
    volumes:
      - ./user-service:/var/www
      - ./docker/nginx/user-service.conf:/etc/nginx/conf.d/default.conf
    networks:
      - microservices
    depends_on:
      - user-service

  product-nginx:
    image: nginx:alpine
    container_name: product-nginx
    ports:
      - "8002:80"
    volumes:
      - ./product-service:/var/www
      - ./docker/nginx/product-service.conf:/etc/nginx/conf.d/default.conf
    networks:
      - microservices
    depends_on:
      - product-service

  order-nginx:
    image: nginx:alpine
    container_name: order-nginx
    ports:
      - "8003:80"
    volumes:
      - ./order-service:/var/www
      - ./docker/nginx/order-service.conf:/etc/nginx/conf.d/default.conf
    networks:
      - microservices
    depends_on:
      - order-service

  gateway-nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    ports:
      - "8000:80"
    volumes:
      - ./api-gateway:/var/www
      - ./docker/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf
    networks:
      - microservices
    depends_on:
      - api-gateway

  # ─── Databases ──────────────────────────────────────────────
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_password
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - microservices

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: product_service
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_password
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - microservices

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - microservices

  # ─── Kafka + Zookeeper ──────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - microservices

  # ─── Kafka UI (Optional) ────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - microservices
    depends_on:
      - kafka

# ─── Volumes ────────────────────────────────────────────────
volumes:
  user-db-data:
  product-db-data:
  order-db-data:

# ─── Networks ───────────────────────────────────────────────
networks:
  microservices:
    driver: bridge